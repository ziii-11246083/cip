<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <style>
        html.js-enabled body{opacity:0;transition:opacity .5s ease;}
        html.js-enabled body.page-ready{opacity:1;}
    </style>
    <script>document.documentElement.classList.add('js-enabled');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>智慧投資決策分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121212; 
            background-image: radial-gradient(circle at top right, #231f32, #121212 60%);
            color: #f8fafc; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }
        .table-container { background-color: #1e1e24; border: 1px solid #3f3f5a; }
        .table { color: #f8fafc; margin-bottom: 0; }
        .table thead th { position: sticky; top: 0; z-index: 10; background-color: #181820; border-bottom: 2px solid #6366f1; color: #cbd5e1; font-weight: 700; padding: 18px 12px; }
        .table tbody td { padding: 15px 12px; vertical-align: middle; border-bottom: 1px solid #2d2d3a; }
        .table-hover tbody tr:hover { color: #fff; background-color: #2b2b36; }
        .up { color: #4ade80; font-weight: bold; }
        .down { color: #fb7185; font-weight: bold; }
        .crypto-name { font-size: 1.3rem; font-weight: bold; color: #fff; }
        .risk-spectrum-container { width: 140px; height: 8px; background: #2d2d3a; border-radius: 4px; position: relative; margin-top: 5px; }
        .risk-gradient { width: 100%; height: 100%; background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #fb7185 100%); border-radius: 4px; opacity: 0.85; }
        .risk-pointer { width: 6px; height: 12px; background: #fff; position: absolute; top: -2px; transform: translateX(-50%); border-radius: 2px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .btn-analyze { border: 1px solid #6366f1; color: #a5b4fc; padding: 4px 12px; border-radius: 15px; text-decoration: none; white-space: nowrap; font-size: 0.9rem; transition: all 0.2s; }
        .btn-analyze:hover { background: #6366f1; color: #fff; box-shadow: 0 0 10px rgba(99, 102, 241, 0.6); }
        .dashboard-card { background: linear-gradient(145deg, #1e1e24, #252530); border: 1px solid #3f3f5a; border-radius: 12px; padding: 20px; height: 100%; }
        .highlight-text { color: #c084fc; font-weight: bold; }
        .text-ai-theme { color: #a78bfa !important; }
        .form-control:focus, .form-select:focus { background-color: #1e1e24; color: #fff; border-color: #a78bfa; box-shadow: 0 0 0 0.25rem rgba(167, 139, 250, 0.25); }
    </style>
</head>
<body>
    <div class="container-fluid py-4" style="max-width: 96%;">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div><h2 class="fw-bold mb-0 text-white"><i class="fas fa-brain text-ai-theme"></i> 智慧投資決策分析平台</h2></div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="dashboard-card shadow-sm">
                    <h5 class="text-warning mb-3"><i class="fas fa-radar"></i> AI 敘事雷達 (Narrative Radar)</h5>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="text-muted small">當前最熱門市場敘事</div>
                            <h2 id="top-narrative" class="mb-0 text-light">掃描中...</h2>
                        </div>
                        <div class="text-end">
                            <div class="text-muted small">敘事熱度分數</div>
                            <h3 id="narrative-score" class="highlight-text mb-0">-</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="dashboard-card shadow-sm">
                    <h5 class="text-success mb-3"><i class="fas fa-podcast"></i> 自動化 Podcast 晨報</h5>
                    <p class="text-muted small mb-2">一鍵呼叫 OpenAI，為您總結最新市場動態並生成專屬廣播。</p>
                    <button class="btn btn-outline-success w-100" id="btn-podcast" onclick="generatePodcast()" style="border-radius: 8px;">
                        <i class="fas fa-play-circle"></i> 生成並播放今日 AI 晨報
                    </button>
                    <audio id="podcast-player" class="w-100 mt-3 d-none" controls></audio>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-card shadow-sm">
                    <h5 class="text-ai-theme mb-3"><i class="fas fa-robot"></i> 專屬 AI 智能理財顧問 (Robo-Advisor)</h5>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label text-muted small mb-1">💰 投資金額 (USD)</label>
                                <input type="number" id="invest-amount" class="form-control bg-dark text-white border-secondary" placeholder="例如: 10000" min="100" value="10000">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small mb-1">⚡ 風險承受度</label>
                                <select id="risk-level" class="form-select bg-dark text-white border-secondary">
                                    <option value="保守 (Conservative)">🟢 保守 (建議持有穩定資產)</option>
                                    <option value="穩健 (Balanced)" selected>🟡 穩健 (平衡風險與報酬)</option>
                                    <option value="積極 (Aggressive)">🔴 積極 (追求高成長爆發)</option>
                                </select>
                            </div>
                            <button class="btn w-100 mt-1 shadow-sm" id="btn-portfolio" onclick="analyzePortfolio()" style="background-color: #a78bfa; color: #121212; font-weight: bold; border-radius: 8px;">
                                <i class="fas fa-magic"></i> 獲取專屬投資建議
                            </button>
                        </div>
                        <div class="col-md-9">
                            <div id="portfolio-result" class="p-3 rounded border h-100" style="background-color: #181820; border-color: #3f3f5a !important; min-height: 200px;">
                                <div class="d-flex align-items-center justify-content-center h-100 text-muted">
                                    <span>請在左側輸入投資金額與偏好，讓 AI 為您量身打造資產配置策略。</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-3">
            <input type="text" id="search-input" class="form-control text-white border-secondary" placeholder="🔍 搜尋資產..." style="max-width: 300px; background-color: #1e1e24;">
            <a href="/social-sentiment" class="btn btn-outline-light" style="border-color: #cbd5e1; color: #cbd5e1;">📡 訊噪分離器</a>
        </div>
        
        <div class="table-responsive rounded shadow-sm table-container mb-3" style="max-height: 600px;">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr><th class="text-center" style="border-top-left-radius: 6px;">排名</th><th>資產名稱</th><th>即時價格 (USD)</th><th>24H 漲跌幅</th><th style="border-top-right-radius: 6px;">風險指數 (SFI)</th></tr>
                </thead>
                <tbody id="crypto-body">
                    <tr><td colspan="5" class="text-center py-5 text-muted">資料載入中，請稍候...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allCryptoData = [];
        document.getElementById('search-input').addEventListener('input', renderTable);
        
        async function fetchData() {
            try {
                const response = await fetch('/api/coingecko');
                const result = await response.json();
                if (!result.data) return;
                allCryptoData = result.data;
                renderTable();
            } catch (error) { console.error("大盤資料載入失敗", error); }
        }

        async function fetchNarratives() {
            try {
                const response = await fetch('/api/narratives');
                const data = await response.json();
                if(data.top_narrative) {
                    document.getElementById('top-narrative').innerText = data.top_narrative;
                    document.getElementById('narrative-score').innerText = data.narrative_scores[data.top_narrative] + " 分";
                } else {
                    document.getElementById('top-narrative').innerText = "市場盤整中";
                    document.getElementById('narrative-score').innerText = "0 分";
                }
            } catch (error) { 
                document.getElementById('top-narrative').innerText = "雷達連線失敗"; 
            }
        }

        async function generatePodcast() {
            const btn = document.getElementById('btn-podcast');
            const player = document.getElementById('podcast-player');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI 正在撰寫講稿與錄音，大約需 10~20 秒...';
            btn.disabled = true;
            player.classList.add('d-none');

            try {
                const scriptRes = await fetch('/api/podcast/generate', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({market: "CRYPTO", watchlist: ["BTC", "ETH", "SOL"]})
                });
                const scriptData = await scriptRes.json();
                if(scriptData.error) throw new Error(scriptData.error);

                const ttsRes = await fetch('/api/podcast/tts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: scriptData.script})
                });
                
                const blob = await ttsRes.blob();
                const audioUrl = window.URL.createObjectURL(blob);
                
                player.src = audioUrl;
                player.classList.remove('d-none');
                player.play();
                
                btn.innerHTML = '<i class="fas fa-check-circle"></i> 晨報已就緒！(可再次點擊重整)';
            } catch(e) {
                btn.innerHTML = '<i class="fas fa-times-circle"></i> 生成失敗 (請確認已設定 OpenAI API Key)';
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        async function analyzePortfolio() {
            const amount = document.getElementById('invest-amount').value;
            const riskLevel = document.getElementById('risk-level').value;
            const btn = document.getElementById('btn-portfolio');
            const resultDiv = document.getElementById('portfolio-result');
            
            if (!amount || amount <= 0) {
                alert("請輸入有效的投資金額！");
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI 規劃中...';
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="d-flex align-items-center justify-content-center h-100 text-muted"><span class="text-ai-theme"><i class="fas fa-cog fa-spin"></i> OpenAI 正在為您量身打造資產配置，請稍候...</span></div>';

            try {
                const res = await fetch('/api/portfolio/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount, risk_level: riskLevel })
                });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                let highlightsHtml = '<ul class="mb-0 mt-2" style="list-style-type: none; padding-left: 0;">';
                data.highlights.forEach(h => {
                    highlightsHtml += `<li class="text-warning mb-1"><i class="fas fa-exclamation-circle text-danger me-2"></i>${h}</li>`;
                });
                highlightsHtml += '</ul>';

                resultDiv.innerHTML = `
                    <div class="text-light mb-3"><strong class="text-ai-theme fs-5">🗣️ 專屬 AI 配置建議：</strong><br><div class="mt-2 lh-lg">${data.narrative.replace(/\n/g, '<br>')}</div></div>
                    <hr class="my-3" style="border-color: #3f3f5a;">
                    <div class="text-light"><strong class="text-danger fs-6">⚡ 投資風險與注意事項：</strong>${highlightsHtml}</div>
                `;
                btn.innerHTML = '<i class="fas fa-magic"></i> 重新獲取建議';
            } catch(e) {
                resultDiv.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-triangle"></i> 診斷失敗：${e.message}</span>`;
                btn.innerHTML = '<i class="fas fa-magic"></i> 再次嘗試';
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }
        
        function renderTable() {
            const tbody = document.getElementById('crypto-body'); tbody.innerHTML = ''; 
            const searchText = document.getElementById('search-input').value.toLowerCase().trim();
            const filteredData = allCryptoData.filter(c => c.name.toLowerCase().includes(searchText) || c.cn_name.toLowerCase().includes(searchText)).slice(0, 50);
            
            filteredData.forEach(coin => {
                let changeColor = coin.change >= 0 ? 'up' : 'down';
                let riskDisplay = '';
                
                if (coin.risk && coin.risk.score !== undefined) {
                    let score = coin.risk.score;
                    let msg = coin.risk.msg || '';
                    let scoreColor = score > 65 ? '#fb7185' : (score > 40 ? '#facc15' : '#4ade80');
                    
                    let corr = coin.risk.corr || 0;
                    let beta = coin.risk.beta || 1;
                    let lambda = coin.risk.lambda || 0;
                    let level = coin.risk.level || 'base';
                    
                    let params = `name=${encodeURIComponent(coin.cn_name)}&corr=${corr}&score=${score}&beta=${beta}&lambda=${lambda}&level=${level}`;
                    
                    riskDisplay = `
                        <div class="d-flex align-items-center">
                            <div>
                                <div class="d-flex justify-content-between mb-1" style="width: 140px;">
                                    <span style="font-size: 0.9rem; font-weight: bold; color: ${scoreColor};">${msg}</span>
                                    <span style="font-size: 0.8rem; color: #94a3b8;">${score}/100</span>
                                </div>
                                <div class="risk-spectrum-container">
                                    <div class="risk-gradient"></div>
                                    <div class="risk-pointer" style="left: ${score}%;"></div>
                                </div>
                            </div>
                            ${coin.symbol !== 'BTC' ? `<a href="/analysis/${coin.symbol}?${params}" class="btn-analyze ms-4"><i class="fas fa-chart-line"></i> 分析</a>` : ''}
                        </div>`;
                }
                
                let price = coin.price_usd;
                tbody.innerHTML += `<tr><td class="text-center text-muted fw-bold">${coin.rank}</td><td><div><div class="crypto-name">${coin.cn_name}</div><div class="crypto-symbol text-secondary">${coin.symbol}</div></div></td><td class="fw-bold fs-5 text-white">$ ${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}</td><td class="${changeColor}">${coin.change ? coin.change.toFixed(2) : '0.00'}%</td><td>${riskDisplay}</td></tr>`;
            });
        }
        
        setInterval(fetchData, 300000); 
        fetchData(); 
        fetchNarratives();
    </script>
</body>
</html>
