<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <div class="brand-mark">
        <img src="{{ url_for('static', filename='img/logo-compact.jpg') }}" width="44" height="44" alt="" onerror="this.style.display='none'; this.parentElement.textContent='SIC';">
      </div>
      <div class="brand-text">
        <strong>Smart Invest Crypto</strong>
        <span>智慧虛擬貨幣投資平台</span>
      </div>
    </a>

    <div class="header-right">
      <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="選單" aria-controls="primaryNavigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path class="mobile-nav-open-icon" d="M4 6h16M4 12h16M4 18h16" />
          <path class="mobile-nav-close-icon" d="m6 6 12 12M6 18 18 6" />
        </svg>
        <span class="phone-hide">選單</span>
      </button>
      <nav class="nav header-nav" id="primaryNavigation" aria-label="主要導覽">
        <div class="nav-group primary-links">
          <a href="/"><i class="fas fa-house phone-only" aria-hidden="true"></i> 首頁</a>
          <a href="/market"><i class="fas fa-chart-line phone-only" aria-hidden="true"></i> 市場總覽</a>
          <a href="/podcast"><i class="fas fa-podcast phone-only" aria-hidden="true"></i> Podcast</a>
          <a href="/scam-detect"><i class="fas fa-shield-halved phone-only" aria-hidden="true"></i> 防詐檢測</a>
        </div>

        <details class="nav-more">
          <summary>更多工具 <i class="fas fa-chevron-down"></i></summary>
          <div class="nav-more-menu">
            <a href="/social-sentiment"><i class="fas fa-satellite-dish"></i> 社群分析</a>
            <a href="/narrative-radar"><i class="fas fa-brain"></i> 敘事雷達</a>
            <a href="/analysis/BTC"><i class="fas fa-microscope"></i> BTC 分析</a>
          </div>
        </details>

        <span class="nav-divider"></span>

        <div class="nav-group member-links">
          <a href="/health" class="member-nav" data-member-required="投資健康度"><i class="fas fa-lock"></i> 投資健康度</a>
          <a href="/ai-coach" class="member-nav" data-member-required="AI 投資教練"><i class="fas fa-lock"></i> AI 投資教練</a>
          <a class="member-nav" href="/sim-trade" data-member-required="模擬交易"><i class="fas fa-lock"></i> 模擬交易</a>
          <a class="member-nav" href="/member" data-member-required="會員中心"><i class="fas fa-lock"></i> 會員中心</a>
        </div>
        <a class="mobile-join-link" href="/membership"><i class="fas fa-star" aria-hidden="true"></i> 加入會員</a>
      </nav>

      <div class="auth-area">
        <button class="auth-btn" id="loginToggle" type="button" aria-controls="accountPopup" aria-expanded="false">
          <i class="fas fa-user" aria-hidden="true"></i> 登入
        </button>
        <a class="join-member-link" href="/membership"><i class="fas fa-star" aria-hidden="true"></i> 加入會員</a>

        <div class="account-popup" id="accountPopup" role="dialog" aria-labelledby="memberLoginTitle">
          <button class="popup-close" id="popupClose" type="button" aria-label="關閉登入視窗">×</button>

          <div class="login-head">
            <div class="login-head-icon"><i class="fas fa-lock"></i></div>
            <div>
              <h3 id="memberLoginTitle">會員登入</h3>
              <p class="phone-hide">登入後可使用投資健康度、AI 投資教練、模擬交易與會員中心。</p>
            </div>
          </div>

          <form class="login-form" id="headerLoginForm" method="post">
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="請輸入 Email" required>

            <label for="passwordInput">密碼</label>
            <input type="password" id="passwordInput" name="password" autocomplete="current-password" enterkeyhint="go" placeholder="請輸入密碼" required>

            <button class="login-submit" type="submit">登入會員</button>

            <div class="or-line">
              <span></span>
              <p>或使用 Google</p>
              <span></span>
            </div>

            <button class="google-login" type="button" onclick="if(window.authManager) window.authManager.loginWithGoogle()">
              <span class="google-mark">G</span> 使用 Google 登入
            </button>

            <button class="forgot-btn" type="button" id="forgotPasswordBtn">忘記密碼</button>

            <div class="login-plan-teaser">
              <span><i class="fas fa-star" aria-hidden="true"></i> 進階會員 99 TWD／月 <small>規劃中</small></span>
              <a href="/membership">查看方案 <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
            </div>
          </form>
        </div>

        <details class="user-menu" id="user-section">
          <summary class="user-avatar-toggle" aria-label="開啟會員選單">
            <span class="user-avatar"><img data-user-avatar hidden alt=""><i class="fas fa-user" data-user-avatar-icon></i></span>
          </summary>
          <div class="user-menu-panel">
            <div class="user-menu-profile">
              <span class="user-avatar large"><img data-user-avatar hidden alt=""><i class="fas fa-user" data-user-avatar-icon></i></span>
              <div>
                <strong id="user-name">會員</strong>
                <span id="user-email"></span>
              </div>
            </div>
            <a class="user-menu-profile-link" href="/member#profileEditor"><i class="fas fa-user-pen"></i> 編輯個人資料</a>
            <button class="user-menu-logout" type="button" onclick="if(window.authManager) window.authManager.logoutUser()">登出</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</header>
