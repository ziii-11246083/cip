<!doctype html>
<html lang="zh-Hant">
<head>
  <style>
    html.js-enabled body{opacity:0;transition:opacity .5s ease;}
    html.js-enabled body.page-ready{opacity:1;}
  </style>
  <script>document.documentElement.classList.add('js-enabled');</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 敘事雷達 | Smart Invest Crypto</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo.jpg') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iansui@1.0/dist/iansui.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=radar">
  <style>
    .radar-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,.55fr);gap:22px;align-items:start}
    .radar-list{display:grid;gap:12px}
    .radar-item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}
    .radar-item strong{display:block;color:var(--dark);font-size:18px}
    .radar-item span{display:block;margin-top:4px;color:var(--muted);font-weight:800}
    .radar-score{font-size:24px;font-weight:950;color:var(--brand)}
    .quick-actions{display:grid;gap:12px}
    .quick-actions .button{justify-content:flex-start}
    .risk-table{width:100%;border-collapse:collapse;background:#fff}
    .risk-table th,.risk-table td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}
    .risk-table th{color:var(--muted);font-size:13px}
    .risk-table td{font-weight:850;color:var(--dark)}
    @media(max-width:980px){.radar-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
{% include "partials/header.html" %}
<main>
  <section class="hero">
    <div class="container hero-grid">
      <div class="reveal is-visible">
        <div class="eyebrow"><i class="fas fa-brain"></i> Narrative Radar</div>
        <h1 class="hero-title">AI 敘事雷達</h1>
        <p class="hero-lead">先看市場正在討論什麼，再搭配 SFI 風險排名決定要研究哪個幣種。</p>
      </div>
      <div class="hero-card reveal is-visible">
        <div class="hero-card-title">
          <div class="hero-card-icon"><i class="fas fa-signal"></i></div>
          <div><small>TOP NARRATIVE</small><strong id="topNarrative">掃描中</strong></div>
        </div>
        <div class="hero-mini-grid">
          <div class="hero-mini"><span>熱度</span><strong id="topScore">--</strong></div>
          <div class="hero-mini"><span>市場</span><strong>Crypto</strong></div>
          <div class="hero-mini"><span>用途</span><strong>選題</strong></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container radar-grid">
      <section class="card">
        <div class="section-head">
          <div>
            <h2 class="section-title">熱門敘事</h2>
            <p class="section-copy">分數越高，代表近期訊號越集中。</p>
          </div>
        </div>
        <div class="radar-list" id="narrativeList"><div class="member-record-empty">資料載入中...</div></div>
      </section>

      <aside class="card">
        <h2 class="section-title">下一步</h2>
        <div class="quick-actions" style="margin-top:18px">
          <a class="button primary" href="/market"><i class="fas fa-chart-line"></i> 看市場</a>
          <a class="button" href="/analysis/BTC"><i class="fas fa-microscope"></i> 分析 BTC</a>
          <a class="button" href="/social-sentiment"><i class="fas fa-satellite-dish"></i> 看社群</a>
        </div>
      </aside>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="card">
        <div class="section-head">
          <div>
            <h2 class="section-title">SFI 風險快排</h2>
            <p class="section-copy">用風險分數幫你避開過熱或波動過大的標的。</p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="risk-table">
            <thead><tr><th>排名</th><th>幣種</th><th>24H</th><th>SFI</th><th></th></tr></thead>
            <tbody id="riskRows"><tr><td colspan="5">資料載入中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>
<div class="float-actions"><a href="/" class="float-btn" title="回首頁"><i class="fas fa-house"></i></a><button class="float-btn" id="backToTopBtn" type="button" title="回到頂部"><i class="fas fa-arrow-up"></i></button></div>
{% include "partials/footer.html" %}
<div class="toast" id="toast"><div class="t">提示</div><div class="m">--</div></div>
<script>window.__SUPABASE_CONFIG__ = { url: '{{ supabase_url | default("https://dummy.supabase.co") }}', anonKey: '{{ supabase_anon_key | default("dummy") }}' };</script>
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}?v=auth-state-20260830"></script>
<script src="{{ url_for('static', filename='js/common.js') }}?v=member-nav-lock-20260604"></script>
<script src="{{ url_for('static', filename='js/narrative_radar.js') }}?v=radar"></script>
</body>
</html>
