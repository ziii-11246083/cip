<!doctype html>
<html lang="zh-Hant">
<head>
  <style>
    html.js-enabled body{opacity:0;transition:opacity .5s ease;}
    html.js-enabled body.page-ready{opacity:1;}
  </style>
  <script>document.documentElement.classList.add('js-enabled');</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 投資教練 | Smart Invest Crypto</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iansui@1.0/dist/iansui.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=member-overlay-20260604">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ai_coach.css') }}?v=utf8fix">
</head>
<body>
  
{% include "partials/header.html" %}

<main>
  <section class="hero coach-hero">
    <div class="container hero-grid">
      <div>
        <div class="eyebrow"><i class="fas fa-robot"></i> AI Coach</div>
        <h1 class="hero-title">專屬 AI 投資教練</h1>
        <p class="hero-lead">用聊天方式詢問市場、配置、風險與新手投資觀念。登入會員後可使用完整對話與個人化建議。</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container wide-container coach-layout">
      <div class="coach-side-stack">
        <section class="card coach-panel" data-member-feature="AI 投資教練">
          <h2 class="section-title small-title">選擇你的風險偏好</h2>
          <input type="hidden" id="riskProfile" value="穩健型">
          <div class="risk-card-grid">
            <button class="risk-card" data-risk="保守型" type="button"><strong>保守型</strong></button>
            <button class="risk-card active" data-risk="穩健型" type="button"><strong>穩健型</strong></button>
            <button class="risk-card" data-risk="積極型" type="button"><strong>積極型</strong></button>
          </div>
          <div class="quick-prompts">
            <strong>快速提問</strong>
            <button type="button" data-question="BTC 和 ETH 的配置比例該怎麼抓？">BTC / ETH 配置</button>
            <button type="button" data-question="我該如何降低加密貨幣投資風險？">降低風險</button>
          </div>
        </section>

        <section class="card coach-history-card" data-member-feature="AI 投資教練">
          <div class="coach-history-head">
            <h2>對話紀錄</h2>
            <button class="button primary coach-history-new" id="aiCoachNewChatBtn" type="button">
              <i class="fas fa-plus"></i> New Chat
            </button>
          </div>
          <div class="conversation-list" id="aiCoachConversationList"></div>
        </section>
      </div>

      <section class="card coach-chat" data-member-feature="AI 投資教練">
        <div class="chat-head"><div><strong>AI 教練聊天室</strong><span>輸入問題後，AI 會整理成可執行的建議。</span></div></div>
        <div class="chat-stream" id="chatStream">
          <div class="chat-row ai"><div class="avatar">AI</div><div class="bubble"><b>AI 投資教練</b><p>你好，請問你現在最想解決的投資問題是什麼？</p></div></div>
        </div>
        <div class="chat-input-row"><input id="chatInput" placeholder="例如：我現在適合買 BTC 嗎？"><button id="btnSend" type="button"><i class="fas fa-paper-plane"></i> 傳送</button></div>
      </section>
    </div>
  </section>
</main>

<div class="float-actions"><a href="/" class="float-btn" title="回首頁"><i class="fas fa-house"></i></a><button class="float-btn" id="backToTopBtn" type="button" title="回到頂部"><i class="fas fa-arrow-up"></i></button></div>
<footer class="footer"><div class="container footer-inner"><div>© Smart Invest Crypto · 加密資產風險與市場分析</div><div>Market · Health · Podcast · AI Agent</div></div></footer>
<div class="toast" id="toast"><div class="t" id="toastT">提示</div><div class="m" id="toastM">--</div></div>
<script>window.__SUPABASE_CONFIG__ = { url: '{{ supabase_url | default("https://dummy.supabase.co") }}', anonKey: '{{ supabase_anon_key | default("dummy") }}' };</script>
<script type="module" src="{{ url_for('static', filename='js/auth.js') }}?v=member-nav-lock-20260604"></script>
<script src="{{ url_for('static', filename='js/common.js') }}?v=member-nav-lock-20260604"></script>
<script src="{{ url_for('static', filename='js/ai_coach.js') }}?v=member-lock"></script>
</body>
</html>
